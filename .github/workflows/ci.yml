name: CI

on:
  push:
    branches: [production, development]
  pull_request:
    branches: [production, development]

jobs:
  preflight:
    name: Lint, em-dash check, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run preflight

      - run: pnpm run build

      - name: Fixtures match the code that generated them
        run: |
          pnpm run fixtures:write
          git diff --exit-code -- fixtures/ || {
            echo "::error::fixtures/ is stale. Run 'pnpm run fixtures:write' and commit the result."
            exit 1
          }
